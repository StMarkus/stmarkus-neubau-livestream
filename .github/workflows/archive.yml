name: Archive month to Google Drive

on:
  schedule:
    - cron: "37 3 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Monat YYYY-MM (leer = Vormonat)"
        required: false

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Archive
        env:
          DRIVE_REMOTE: ${{ vars.DRIVE_REMOTE || 'gdrive:Neubau-Livestream' }}
          MONTH: ${{ inputs.month }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 archive_month.py ${MONTH:+--month "$MONTH"}
